name: Security tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  file-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
      - run: python -m pip install Flask
      - run: python -m unittest discover -s tests -v
